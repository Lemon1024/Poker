<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>GTO训练营 · 训练工作台</title>
  <link rel="stylesheet" href="web/style.css">
  <link rel="stylesheet" href="web/camp.css">
  <script defer src="preflop/ranges.js"></script>
  <script defer src="training/session.js"></script>
  <script defer src="web/home.js"></script>
</head>
<body class="camp-home">
  <header class="topbar"><div class="frame topbar-inner">
    <div class="brand"><span class="brand-mark" aria-hidden="true">♠</span>GTO训练营</div>
    <span class="offline"><i></i>本地离线</span>
  </div></header>
  <main class="frame camp-desk">
    <section class="camp-hero" aria-labelledby="train-title">
      <div class="camp-hero-copy">
        <p class="camp-model">6 人现金桌 <span>／</span> 100 BB</p>
        <h1 id="train-title">翻前决策训练</h1>
        <p class="camp-description">每轮 10 手，练习开池、面对开池与应对 3-bet。</p>
        <div class="camp-cta">
          <a id="start-training" class="primary" href="training/index.html">开始训练</a>
          <a class="camp-review" href="training/index.html#review">错题本 <span aria-hidden="true">↗</span></a>
        </div>
      </div>
      <div class="camp-art" aria-hidden="true"><span class="back-card far"></span><span class="back-card near"><b>♠</b></span></div>
    </section>
    <section class="camp-tools" aria-labelledby="study-title">
      <h2 id="study-title">学习工具</h2>
      <div class="tool-grid">
        <a class="tool-card" id="open-preflop" href="preflop/index.html">
          <span class="tool-icon grid-icon" aria-hidden="true">▦</span>
          <div><h3>查翻前范围</h3><p>169 类起手牌 · 位置对照</p></div><span class="tool-go" aria-hidden="true">↗</span>
        </a>
        <a class="tool-card" id="open-equity" href="equity.html">
          <span class="tool-icon equity-icon" aria-hidden="true">◔</span>
          <div><h3>权益复盘</h3><p>独赢、平局与底池权益</p></div><span class="tool-go" aria-hidden="true">↗</span>
        </a>
        <a class="tool-card" id="open-strategy" href="strategy/index.html" hidden>
          <span class="tool-icon river-icon" aria-hidden="true">⑂</span>
          <div><h3>河牌策略</h3><p>行动树、频率与 EV</p></div><span class="tool-go" aria-hidden="true">↗</span>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
